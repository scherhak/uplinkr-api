name: tests

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: [ "8.4", "8.5" ]
        laravel:
          - version: "^12.0"
            testbench: "^10.0"
            phpunit: "^11.0|^12.0"
          - version: "^13.0"
            testbench: "^11.0"
            phpunit: "^12.0"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT
      - name: Cache Composer
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ matrix.php }}-laravel-${{ matrix.laravel.version }}-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-composer-${{ matrix.php }}-
            ${{ runner.os }}-composer-

      - name: Validate composer.json
        run: composer validate --strict

      - name: Select Laravel test matrix
        run: |
          composer require --no-update \
            "illuminate/http:${{ matrix.laravel.version }}" \
            "illuminate/routing:${{ matrix.laravel.version }}" \
            "illuminate/support:${{ matrix.laravel.version }}"
          composer require --dev --no-update \
            "orchestra/testbench:${{ matrix.laravel.testbench }}" \
            "phpunit/phpunit:${{ matrix.laravel.phpunit }}"

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress --with-all-dependencies

      - name: Run PHPUnit
        run: ./vendor/bin/phpunit --testdox
